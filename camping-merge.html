<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfe6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캠핑 머지">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>캠핑 머지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen sunny campsite — HUD, wooden crate playfield, item tray, collection trail */
:root{
  --night:#1f3a4a;
  --sky:#bfe6f8;
  --sky-2:#eef8fd;
  --ink:#1f3a4a;
  --ink-soft:#56788a;
  --score:#e8701a;
  --ember:#ff8a3d;
  --flame:#ffc857;
  --snow:#f6f0e4;
  --wood:#8a5a33;
  --wood-dark:#5c3a1f;
  --cream:#fffaf0;
  --cream-edge:#e7cfa4;
  --cream-shadow:#cfae79;
  --danger:#ff5a5a;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 75%);
  background-color:var(--sky-2);
  color:var(--ink);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;display:flex;flex-direction:column;gap:8px;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:560px;margin:0 auto;box-sizing:border-box;
}
.hud{display:flex;align-items:center;gap:8px}
.scorebox{
  display:flex;align-items:center;gap:12px;padding:6px 14px 6px 12px;border-radius:16px;
  background:var(--cream);border:2px solid var(--cream-edge);box-shadow:0 3px 0 var(--cream-shadow);
}
.stat{display:flex;flex-direction:column;line-height:1}
.stat .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.stat .val{font-family:var(--f-display);font-size:28px;color:var(--score);font-variant-numeric:tabular-nums;margin-top:3px;display:inline-block}
.stat .val.bump{animation:bump .28s ease-out}
@keyframes bump{40%{transform:scale(1.22)}}
.stat.best .val{font-size:18px;color:var(--ink)}
.spacer{flex:1}
.next{display:flex;flex-direction:column;align-items:center;gap:2px}
.next .lbl{font-size:10px;letter-spacing:.08em;color:var(--ink-soft)}
.chip{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.75);border:2px solid var(--cream-edge)}
.chip img{width:100%;height:100%;display:block}
.iconbtn{
  width:40px;height:40px;border-radius:12px;border:2px solid var(--cream-edge);
  background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--cream-shadow);
  display:grid;place-items:center;padding:0;
}
.iconbtn svg{width:22px;height:22px}
.iconbtn.off{opacity:.5}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cream-shadow)}
.iconbtn:focus-visible,.btn:focus-visible,.tool:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.box{
  position:relative;border-radius:16px;
  border:7px solid var(--wood);
  box-shadow:0 0 0 2px var(--wood-dark),inset 0 0 0 2px rgba(255,255,255,.15),0 16px 40px rgba(31,58,74,.25);
  overflow:hidden;touch-action:none;cursor:pointer;
}
.box.hammer{cursor:crosshair}
canvas{display:block;touch-action:none}
[hidden]{display:none!important}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px;
  background:rgba(22,48,64,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.logo{font-family:var(--f-display);font-weight:400;font-size:52px;margin:0;color:#fff;line-height:1;
  text-shadow:0 4px 0 var(--ember),0 7px 0 var(--wood-dark),0 12px 24px rgba(0,0,0,.35);transform:rotate(-3deg)}
.logo small{display:block;font-size:17px;color:var(--flame);text-shadow:0 2px 0 var(--wood-dark);margin-top:10px;transform:rotate(2deg)}
.parade{display:flex;gap:2px;justify-content:center;align-items:flex-end;height:64px}
.parade img{display:block;animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px) rotate(-6deg)}55%{transform:translateY(-10px) rotate(6deg)}}
.overlay h2{font-family:var(--f-display);font-weight:400;font-size:38px;margin:0;color:#fff;text-shadow:0 3px 0 var(--ember),0 6px 0 var(--wood-dark)}
.overlay p{margin:0;color:rgba(246,240,228,.9);font-size:15px;line-height:1.6;max-width:26ch}
.final{font-family:var(--f-display);font-size:58px;color:var(--snow);line-height:1;font-variant-numeric:tabular-nums}
.badge{font-family:var(--f-display);font-size:15px;color:var(--night);background:var(--flame);border-radius:999px;padding:4px 12px}
.ioshint{font-size:12px!important;color:var(--flame)!important}
.bestitem{display:flex;align-items:center;gap:8px;color:var(--snow);font-family:var(--f-display);font-size:18px}
.bestitem img{width:56px;height:56px}
.btn{
  font-family:var(--f-display);font-size:24px;color:var(--wood-dark);background:var(--flame);
  border:0;border-radius:16px;padding:12px 34px;cursor:pointer;
  box-shadow:0 6px 0 #c98f22,0 12px 24px rgba(0,0,0,.25);
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98f22}
.toast{
  position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;
  font-family:var(--f-display);font-size:26px;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 3px 0 var(--wood-dark),0 0 14px rgba(0,0,0,.25);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hint{
  position:absolute;left:50%;top:21%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  font-family:var(--f-display);font-size:16px;color:#fff;background:rgba(92,58,31,.85);padding:6px 14px;border-radius:999px;
}
.combo{
  position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none;opacity:0;
  font-family:var(--f-display);font-size:50px;line-height:1;
}
.combo span{display:block;font-size:18px;margin-top:6px;color:#fff;text-shadow:0 2px 0 var(--wood-dark)}
.combo.go{animation:comboPop 1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes comboPop{
  0%{opacity:0;transform:scale(.3) rotate(-10deg)}
  14%{opacity:1;transform:scale(1.3) rotate(4deg)}
  28%{transform:scale(1) rotate(-4deg)}
  78%{opacity:1;transform:scale(1) rotate(-4deg)}
  100%{opacity:0;transform:translateY(-18px) scale(1.05) rotate(-4deg)}
}
.card{position:absolute;left:50%;top:16%;transform:translateX(-50%);perspective:600px;pointer-events:none}
.card-in{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px 12px;border-radius:18px;
  background:var(--cream);border:3px solid var(--flame);box-shadow:0 6px 0 var(--cream-shadow),0 14px 30px rgba(0,0,0,.25);
  animation:flipIn 2.4s ease forwards;transform-origin:50% 50%;
}
.card-tag{font-family:var(--f-display);font-size:14px;color:#fff;background:var(--ember);border-radius:999px;padding:3px 10px}
.card-in img{width:84px;height:84px;margin-top:4px}
.card-in b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--wood-dark)}
.card-in small{font-size:12px;color:var(--ink-soft)}
@keyframes flipIn{
  0%{opacity:0;transform:rotateY(90deg) scale(.7)}
  14%{opacity:1;transform:rotateY(-12deg) scale(1.06)}
  24%{transform:rotateY(0) scale(1)}
  85%{opacity:1;transform:rotateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-12px) scale(.9)}
}
.tools{display:flex;gap:10px}
.tool{
  position:relative;flex:1;min-width:0;height:48px;border-radius:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;
  font-family:var(--f-display);font-size:16px;color:var(--wood-dark);
  background:var(--cream);border:2px solid var(--cream-edge);box-shadow:0 4px 0 var(--cream-shadow);
}
.tool svg{width:24px;height:24px;flex:none}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--cream-shadow)}
.tool:disabled{opacity:.45;cursor:default}
.tool.on{background:#ffe1c2;border-color:var(--ember);box-shadow:0 4px 0 #d9783a}
.tool .cnt{
  position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:11px;padding:0 5px;box-sizing:border-box;
  display:grid;place-items:center;font-size:14px;color:#fff;background:var(--ember);border:2px solid #fff;
  font-variant-numeric:tabular-nums;
}
.tool.gain{animation:gain .6s ease}
@keyframes gain{30%{transform:scale(1.15) rotate(-4deg)}60%{transform:scale(.97) rotate(2deg)}}
.trail{display:flex;flex-direction:column;gap:5px}
.trail .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-soft);display:flex;justify-content:space-between}
.chain{display:flex;justify-content:space-between;gap:2px}
.chain .chip{width:30px;height:30px;border-width:1.5px;opacity:.5;transition:opacity .3s,transform .3s}
.chain .chip.got{opacity:1;border-color:var(--flame)}
.chain .chip.pop{transform:scale(1.4)}
@media (max-width:360px){.chain .chip{width:25px;height:25px}.tool span{display:none}}
@media (max-height:640px){.trail{display:none}}
@media (prefers-reduced-motion:reduce){
  .toast,.chain .chip{transition:none}
  .parade img,.combo.go,.card-in,.tool.gain,.stat .val.bump{animation-duration:.01s}
}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="scorebox">
      <div class="stat"><span class="lbl">점수</span><span class="val" id="score">0</span></div>
      <div class="stat best"><span class="lbl">최고</span><span class="val" id="best">0</span></div>
    </div>
    <div class="spacer"></div>
    <div class="next"><span class="lbl">다음</span><div class="chip" id="next"></div></div>
    <button class="iconbtn" id="music" aria-label="배경음악 끄기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </button>
    <button class="iconbtn" id="fs" aria-label="전체화면" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIn" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path id="fsOut" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" style="display:none"/></svg>
    </button>
    <button class="iconbtn" id="mute" aria-label="소리 끄기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="spkOn" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/><path id="spkOff" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="box" id="box">
      <canvas id="cv"></canvas>
      <div class="combo" id="combo"></div>
      <div class="toast" id="toast"></div>
      <div class="card" id="card" hidden>
        <div class="card-in" id="cardIn"><span class="card-tag">새 물건 발견!</span><img id="cardImg" alt=""><b id="cardName"></b><small id="cardNo"></small></div>
      </div>
      <div class="hint" id="hint" hidden>없앨 물건을 콕 누르세요</div>
      <div class="overlay" id="startOv">
        <div class="parade" id="parade"></div>
        <h1 class="logo">캠핑 머지<small>도토리에서 캠핑카까지!</small></h1>
        <p>같은 캠핑 용품끼리 부딪히면 더 큰 물건이 돼요. 캠핑카 두 대를 합치면 캠핑장 완성!</p>
        <button class="btn" id="startBtn">캠핑 시작</button>
        <p style="font-size:13px">좌우로 움직여 위치를 정하고, 손을 떼면 떨어져요</p>
        <p class="ioshint" id="iosHint" hidden>아이폰은 공유 버튼 → 홈 화면에 추가로 열면 전체화면이 돼요</p>
      </div>
      <div class="overlay" id="overOv" hidden>
        <h2>캠핑 끝!</h2>
        <div class="final" id="finalScore">0</div>
        <span class="badge" id="newBest" hidden>최고 기록!</span>
        <div class="bestitem" id="finalItem"></div>
        <button class="btn" id="againBtn">다시 하기</button>
      </div>
    </div>
  </main>

  <div class="tools">
    <button class="tool" id="tShake" aria-label="흔들기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="5" width="9" height="14" rx="2.5"/><path d="M3.5 8.5v7M20.5 8.5v7M1 10.5v3M23 10.5v3"/></svg>
      <span>흔들기</span><b class="cnt" id="cShake">0</b>
    </button>
    <button class="tool" id="tHammer" aria-label="망치">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3.5l7.5 7.5-3 3L10 6.5z"/><path d="M12 9.5L3.8 17.7a2 2 0 0 0 2.8 2.8L14.8 12.3"/></svg>
      <span>망치</span><b class="cnt" id="cHammer">0</b>
    </button>
    <button class="tool" id="tSwap" aria-label="바꾸기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>
      <span>바꾸기</span><b class="cnt" id="cSwap">0</b>
    </button>
  </div>

  <footer class="trail">
    <span class="lbl"><span>캠핑 도감</span><span id="dexCount"></span></span>
    <div class="chain" id="chain"></div>
  </footer>
</div>

<script>
(() => {
const {Engine, Bodies, Body, Composite, Events, Query} = Matter;

const ITEMS = [
  {n:'도토리',   r:16,  h:28,  s:50, l:44},
  {n:'솔방울',   r:22,  h:35,  s:45, l:52},
  {n:'마시멜로', r:29,  h:340, s:65, l:84},
  {n:'소시지',   r:36,  h:8,   s:62, l:56},
  {n:'머그컵',   r:44,  h:205, s:52, l:54},
  {n:'랜턴',     r:52,  h:44,  s:88, l:60},
  {n:'코펠',     r:61,  h:200, s:12, l:64},
  {n:'모닥불',   r:71,  h:22,  s:88, l:52},
  {n:'캠핑의자', r:82,  h:155, s:42, l:46},
  {n:'텐트',     r:94,  h:22,  s:90, l:60},
  {n:'캠핑카',   r:106, h:175, s:55, l:48},
];
const LAST = ITEMS.length - 1;
const W = 420, H = 620, DROP_Y = 54, DANGER = 108, STEP = 1000/60, TAU = Math.PI*2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hsl = (it, dl=0) => `hsl(${it.h} ${it.s}% ${Math.max(0,Math.min(100,it.l+dl))}%)`;

const $ = id => document.getElementById(id);
const cv = $('cv'), mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

// ---------- physics ----------
const engine = Engine.create({positionIterations:8, velocityIterations:6});
engine.gravity.y = 1.1;
const world = engine.world;
const wallOpt = {isStatic:true, friction:0.3, restitution:0.1};
Composite.add(world, [
  Bodies.rectangle(W/2, H+40, W+200, 80, wallOpt),
  Bodies.rectangle(-40, H/2, 80, H*3, wallOpt),
  Bodies.rectangle(W+40, H/2, 80, H*3, wallOpt),
]);

let clock = 0;
function makeItem(lv, x, y){
  const it = ITEMS[lv];
  x = Math.max(it.r+1, Math.min(W-it.r-1, x));
  const b = Bodies.circle(x, y, it.r, {
    restitution:0.12, friction:0.25, frictionStatic:0.6, frictionAir:0.004, density:0.0012
  });
  b.lvl = lv; b.born = clock; b.gone = false;
  b.sq = 0; b.sqv = 0; b.sqA = Math.PI/2; b.hitT = -1e9; b.seed = Math.random()*4000;
  return b;
}
const items = () => Composite.allBodies(world).filter(b => b.lvl != null);

const queue = [];
let lastThud = 0;
function onCollide(ev){
  for (const p of ev.pairs){
    const a = p.bodyA, b = p.bodyB;
    if (a.lvl == null || b.lvl == null || a.lvl !== b.lvl || a.gone || b.gone) continue;
    a.gone = b.gone = true;
    queue.push([a,b]);
  }
}
// landing squash, "ouch" faces, dust and a soft thud
function onImpact(ev){
  for (const p of ev.pairs){
    const a = p.bodyA, b = p.bodyB, n = p.collision.normal;
    if (a.lvl == null && b.lvl == null) continue;
    const rv = (a.velocity.x - b.velocity.x)*n.x + (a.velocity.y - b.velocity.y)*n.y;
    const v = Math.abs(rv);

    const ang = Math.atan2(n.y, n.x);

      body.sq = Math.min(0.26, Math.max(body.sq, v*0.028)); body.sqv = 0; body.sqA = ang;

let fsWanted = true;
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function enterFs(){
  const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;

  try {
    const pr = req.call(docEl, {navigationUI:'hide'});
    if (pr && pr.then) pr.then(() => { try { screen.orientation.lock('portrait').catch(()=>{}); } catch(e){} }).catch(()=>{});
  } catch(e){}
}
function exitFs(){

}
function renderFs(){

  });

  document.addEventListener('pointerdown', autoFs, true);

// ---------- sound ----------
const sfx = (() => {
  let ac = null;
  function ctxA(){
    if (!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, dur, type='sine', vol=0.18, toF=null, delay=0){
    if (muted) return;
    const a = ctxA(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (toF) o.frequency.exponentialRampToValueAtTime(Math.max(30,toF), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }
  return {
    ctx(){ return ctxA(); },
    unlock(){ ctxA(); },
    drop(){ tone(320, 0.09, 'sine', 0.10, 180); },
    thud(v){ tone(150 + Math.random()*40, 0.08, 'sine', Math.min(0.14, 0.02 + v*0.012), 70); },
    pop(n, c){
      const f = 900*Math.pow(0.86, n)*Math.pow(1.0595, Math.min(c,10)*2);
      tone(f, 0.16, 'triangle', 0.2, f*1.5);
      tone(f*2, 0.08, 'sine', 0.06);
      if (n >= 6) tone(f/2, 0.4, 'sine', 0.18, f/3);
    },
    combo(c){ const b = 660*Math.pow(1.122, Math.min(c,8)); tone(b, 0.12, 'triangle', 0.12); tone(b*1.5, 0.18, 'triangle', 0.1, null, 0.08); },
    chime(){ [880,1175,1568].forEach((f,i) => tone(f, 0.18, 'sine', 0.12, null, i*0.06)); },
    discover(){ [659,784,988,1319].forEach((f,i) => tone(f, 0.22, 'triangle', 0.12, null, i*0.09)); },
    bonk(){ tone(520, 0.07, 'square', 0.08, 180); tone(160, 0.22, 'sine', 0.25, 60); },
    rumble(){ for (let i=0;i<6;i++) tone(70 + Math.random()*40, 0.16, 'sawtooth', 0.05, 50, i*0.06); },
    swish(){ tone(260, 0.16, 'triangle', 0.1, 1300); tone(1300, 0.12, 'sine', 0.05, 500, 0.12); },
    fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f, 0.3, 'triangle', 0.16, null, i*0.11)); },
    over(){ [392,330,262].forEach((f,i)=>tone(f, 0.32, 'sine', 0.14, null, i*0.18)); },
  };
})();

        }));
    loading = Promise.all(jobs).then(list => {

  function init(){
    a = sfx.ctx(); if (!a) return false;
    if (!out){
      const comp = a.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(a.destination);
      out = a.createGain(); out.gain.value = 0; out.connect(comp);

      const len = Math.floor(a.sampleRate*1.3), ir = a.createBuffer(2, len, a.sampleRate);

    const src = a.createBufferSource(); src.buffer = best.buf;
    src.playbackRate.value = Math.pow(2, (midi-best.m)/12);
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t+dur);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.12);
    src.connect(g);
    if (pan && a.createStereoPanner){ const p = a.createStereoPanner(); p.pan.value = pan; g.connect(p).connect(bus); }

  function bird(t){
    // a short, natural-sounding warble: quick falling-then-rising whistles
    const n = 2 + Math.floor(Math.random()*3), base = 2600 + Math.random()*1500, pan = Math.random()*1.6-0.8;
    for (let i=0;i<n;i++){
      const s = t + i*(0.09 + Math.random()*0.05);
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base*1.15, s);
      o.frequency.exponentialRampToValueAtTime(base*0.82, s+0.035);
      o.frequency.exponentialRampToValueAtTime(base*1.25, s+0.07);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.035, s+0.01); g.gain.exponentialRampToValueAtTime(0.0001, s+0.075);
      let node = o.connect(g);

    if (st === 0) play('tuba', TUBA[bar], t, 0.26, 0.6);
    if (st === 8) play('tuba', TUBA[bar]+7, t, 0.22, 0.5);
    if (bar === 3 && st === 12) play('tuba', 45, t, 0.12, 0.5);
    if (bar === 3 && st === 14) play('tuba', 47, t, 0.12, 0.5);
    // nylon guitar: short muted "pah" strums on the off-beats
    if (st === 4 || st === 12) CHORD[bar].forEach((m,i) => play('guitar', m, t+i*0.016, 0.16, 0.26, -0.3));
    if (st === 14 && bar % 2 === 1) CHORD[bar].forEach((m,i) => play('guitar', m+12, t+(2-i)*0.014, 0.1, 0.12, -0.3));
    // melody
    if (section < 2){
      const m = PHRASES[section][bar].get(st);
      if (m != null) play('xylo', 72+m, t, 0.35, 0.5, 0.25);
      if (bar === 1 && st === 12) play('bassoon', 48, t, 0.14, 0.55, 0.15);   // boop
      if (bar === 1 && st === 14) play('bassoon', 43, t, 0.2, 0.6, 0.15);     // boop!
    } else {
      // bassoon steals the tune, staccato and a bit cheeky; xylophone sparkles on top
      const m = PHRASES[0][bar].get(st);
      if (m != null) play('bassoon', 60+m, t, 0.17, 0.5, 0.15);
      if (st === 0) play('xylo', CHORD[bar][2]+24, t, 0.3, 0.25, 0.4);
      if (bar === 3 && st >= 8 && st <= 11) play('xylo', [72,76,79,84][st-8], t, 0.25, 0.4, 0.3);

  }
  function tick(){
    while (nextT < a.currentTime + 0.15){

    start(){

})();

const parts = [], texts = [], rings = [];
let shakeAmt = 0;
function shake(v){ if (!reduceMotion) shakeAmt = Math.max(shakeAmt, v); }
function burst(x, y, count, it, embers){
  for (let i=0;i<count;i++){
    const a = Math.random()*TAU, sp = 1.5 + Math.random()*(embers?7:5);
    const star = Math.random() < 0.25;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.5, life:1, decay:0.016+Math.random()*0.02,
      size:2.5+Math.random()*3.5, g:0.12, star, spin:Math.random()*TAU,
      color: star ? '#ffe066' : Math.random()<0.55 ? (embers ? '#ff8a3d' : hsl(it,10)) : '#ffffff'});
  }
}
function dust(x, y, count){
  for (let i=0;i<count;i++){
    const a = -Math.PI/2 + (Math.random()-0.5)*2.6, sp = 0.6 + Math.random()*1.6;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.6, life:0.7, decay:0.03+Math.random()*0.02,
      size:3+Math.random()*3, g:-0.01, grow:true, color:'rgba(255,250,235,.9)'});
  }
}
function ring(x, y, r, color, k){ rings.push({x, y, r0:r*0.6, r1:r*k, life:1, color}); }
function floatText(x, y, t, small){ texts.push({x, y, t, life:1, small}); }
function updateFx(dt){
  const k = dt/16.67;
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx*k; p.y += p.vy*k; p.vy += p.g*k; p.vx *= 0.98; p.life -= p.decay*k; p.spin += 0.1*k;
    if (p.grow) p.size += 0.15*k;
    if (p.life <= 0) parts.splice(i,1);
  }
  for (let i=texts.length-1;i>=0;i--){
    const t = texts[i]; t.y -= 0.7*k; t.life -= 0.018*k;
    if (t.life <= 0) texts.splice(i,1);
  }
  for (let i=rings.length-1;i>=0;i--){ rings[i].life -= dt/380; if (rings[i].life <= 0) rings.splice(i,1); }
  for (let i=ghosts.length-1;i>=0;i--){ ghosts[i].life -= dt/(ghosts[i].flat ? 260 : 110); if (ghosts[i].life <= 0) ghosts.splice(i,1); }
  for (let i=hammerFx.length-1;i>=0;i--){ hammerFx[i].life -= dt/320; if (hammerFx[i].life <= 0) hammerFx.splice(i,1); }
  shakeAmt *= Math.pow(0.86, k); if (shakeAmt < 0.2) shakeAmt = 0;
}

const bg = document.createElement('canvas');
const clouds = Array.from({length:5}, (_,i) => ({x:Math.random()*W, y:30+i*42+Math.random()*20, s:0.6+Math.random()*0.7, v:0.004+Math.random()*0.008}));
const SUN = {x:W*0.18, y:70, r:30};
// ---------- sun mood: the sun's face reacts to the game ----------
// timed moods (happy, wow, star) win over the steady ones (sleep, dizzy, worried, idle)
const MOOD_RANK = {happy:1, wow:2, star:3};
let mood = {name:'happy', until:0}, sunAng = 0, lastSunT = 0, sunPop = 0;
function setMood(name, ms){
  if (mood.until > clock && (MOOD_RANK[mood.name]||0) > (MOOD_RANK[name]||0)) return;
  mood = {name, until: clock + ms};
  if (name !== 'happy') sunPop = 1;
}
function currentMood(){
  if (state === 'start') return 'sleep';
  if (state === 'over') return 'dizzy';
  if (mood.until > clock) return mood.name;
  if (dangerT > 0) return 'worried';
  return 'idle';
}
function drawSun(t){
  const dt = Math.min(50, t - lastSunT); lastSunT = t;
  const m = currentMood();
  const speed = m === 'star' ? 0.004 : m === 'wow' ? 0.0012 : m === 'sleep' ? 0.00008 : 0.00025;
  sunAng += dt*speed;
  sunPop = Math.max(0, sunPop - dt/600);
  const R = SUN.r;
  let ox = 0, oy = 0;
  if (m === 'worried' && !reduceMotion){ ox = (Math.random()-0.5)*1.6; oy = (Math.random()-0.5)*1.6; }
  if ((m === 'wow' || m === 'star') && !reduceMotion) oy = -Math.abs(Math.sin(t*0.012))*5;
  const sc = 1 + Math.sin(sunPop*Math.PI)*0.18;
  ctx.save(); ctx.translate(SUN.x+ox, SUN.y+oy); ctx.scale(sc, sc);
  // glow
  const sg = ctx.createRadialGradient(0,0,R*0.6,0,0,R*3.2);
  sg.addColorStop(0, m === 'worried' ? 'rgba(255,170,120,.55)' : 'rgba(255,240,150,.6)'); sg.addColorStop(1,'rgba(255,240,150,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0,0,R*3.2,0,Math.PI*2); ctx.fill();
  // rays
  ctx.save(); ctx.rotate(sunAng);
  ctx.strokeStyle = m === 'worried' ? 'rgba(255,150,80,.9)' : 'rgba(255,205,70,.9)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i=0;i<12;i++){ ctx.rotate(Math.PI/6); const L = (i%2 ? 9 : 14) + (m === 'star' ? Math.sin(t*0.02+i)*3 : 0); ctx.beginPath(); ctx.moveTo(R+5,0); ctx.lineTo(R+5+L,0); ctx.stroke(); }
  ctx.restore();
  // disc
  const dg = ctx.createRadialGradient(-R*0.3,-R*0.35,R*0.2,0,0,R);
  dg.addColorStop(0,'#fff1a8'); dg.addColorStop(1, m === 'worried' ? '#ffb347' : '#ffd23f');
  ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#f2a91f'; ctx.stroke();
  drawFace(m, t, R);
  ctx.restore();
}
function drawFace(m, t, R){
  const ink = '#6b3410', ex = R*0.34, ey = -R*0.12;
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const arc = (x,y,r,a0,a1,fill) => { ctx.beginPath(); ctx.arc(x,y,r,a0,a1); fill ? ctx.fill() : ctx.stroke(); };
  const cheeks = (a) => { ctx.fillStyle = `rgba(255,110,110,${a})`; for (const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*R*0.58,R*0.22,R*0.15,R*0.1,0,0,Math.PI*2); ctx.fill(); } ctx.fillStyle = ink; };
  const openMouth = (w,h,y) => { ctx.fillStyle = '#9c2f1c'; ctx.beginPath(); ctx.ellipse(0,y,w,h,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff8a7a'; ctx.beginPath(); ctx.ellipse(0,y+h*0.45,w*0.6,h*0.4,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle = ink; };
  const grin = () => { ctx.fillStyle = '#9c2f1c'; ctx.beginPath(); ctx.arc(0,R*0.12,R*0.4,0.05*Math.PI,0.95*Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff8a7a'; ctx.beginPath(); ctx.ellipse(0,R*0.4,R*0.18,R*0.09,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle = ink; };
  switch (m){
    case 'sleep': {
      for (const s of [-1,1]) arc(s*ex, ey-2, R*0.13, 0.1*Math.PI, 0.9*Math.PI);
      arc(0, R*0.35, R*0.08, 0, Math.PI*2);
      cheeks(.3);
      ctx.font = '14px Jua, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      for (let i=0;i<3;i++){ const ph = ((t/1400) + i/3) % 1; ctx.globalAlpha = 1-ph; ctx.fillStyle = '#3d6d88';
        ctx.fillText('z', R*0.8 + ph*18, -R*0.6 - ph*26); }
      ctx.globalAlpha = 1; ctx.fillStyle = ink;
    } break;
    case 'idle': {
      // pupils glance at the dropper; blink every few seconds
      const look = Math.max(-1, Math.min(1, (aimX - SUN.x)/220));
      const blink = (t % 3800) < 130;
      for (const s of [-1,1]){
        if (blink) { ctx.beginPath(); ctx.moveTo(s*ex-4, ey); ctx.lineTo(s*ex+4, ey); ctx.stroke(); }
        else { ctx.beginPath(); ctx.ellipse(s*ex + look*2.5, ey+1.5, 3.2, 4.2, 0, 0, Math.PI*2); ctx.fill(); }
      }
      arc(0, R*0.12, R*0.32, 0.18*Math.PI, 0.82*Math.PI);
      cheeks(.35);
    } break;
    case 'happy': {
      for (const s of [-1,1]) arc(s*ex, ey+3, R*0.14, 1.15*Math.PI, 1.85*Math.PI);
      grin(); cheeks(.5);
    } break;
    case 'wow': {
      for (const s of [-1,1]){
        ctx.fillStyle = '#fff'; arc(s*ex, ey, R*0.19, 0, Math.PI*2, true);
        ctx.fillStyle = ink; arc(s*ex, ey+1, R*0.1, 0, Math.PI*2, true);
        ctx.beginPath(); ctx.moveTo(s*ex - 5, ey - R*0.38); ctx.quadraticCurveTo(s*ex, ey - R*0.48, s*ex + 5, ey - R*0.38); ctx.stroke();

      openMouth(R*0.2, R*0.22, R*0.38); cheeks(.55);
    } break;
    case 'star': {
      for (const s of [-1,1]){
        ctx.save(); ctx.translate(s*ex, ey); ctx.rotate(t*0.004*s); ctx.fillStyle = '#ff6a1a'; ctx.beginPath();
        for (let i=0;i<10;i++){ const rr = i%2 ? R*0.09 : R*0.22, a = i*Math.PI/5 - Math.PI/2; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      grin(); cheeks(.6);
    } break;
    case 'worried': {
      for (const s of [-1,1]){
        arc(s*ex, ey+2, R*0.09, 0, Math.PI*2, true);
        ctx.beginPath(); ctx.moveTo(s*ex - s*6, ey - R*0.32); ctx.lineTo(s*ex + s*5, ey - R*0.22); ctx.stroke();
      }
      ctx.beginPath(); const y = R*0.4;
      for (let i=0;i<=6;i++){ const x = -R*0.3 + i*R*0.1; const yy = y + (i%2 ? -2.5 : 2.5); i ? ctx.lineTo(x,yy) : ctx.moveTo(x,yy); }
      ctx.stroke();
      // sweat drop
      const dy = (t/900 % 1)*6;
      ctx.fillStyle = '#5ab4e6'; ctx.beginPath(); ctx.moveTo(R*0.72, -R*0.45 + dy);
      ctx.quadraticCurveTo(R*0.92, -R*0.12 + dy, R*0.72, -R*0.06 + dy); ctx.quadraticCurveTo(R*0.52, -R*0.12 + dy, R*0.72, -R*0.45 + dy); ctx.fill();
      ctx.fillStyle = ink;
    } break;
    case 'dizzy': {
      for (const s of [-1,1]){
        ctx.save(); ctx.translate(s*ex, ey); ctx.rotate(t*0.006);
        ctx.beginPath(); ctx.moveTo(-4,-4); ctx.lineTo(4,4); ctx.moveTo(4,-4); ctx.lineTo(-4,4); ctx.stroke(); ctx.restore();
      }
      arc(0, R*0.55, R*0.22, 1.15*Math.PI, 1.85*Math.PI);
    } break;
  }
}

function face(r, A, ex, look){
  const c = ctx, [fx,fy,fs] = A.face, S = r*fs, cx = fx*r, cy = fy*r;
  const ey = cy - 0.1*S, dx = 0.36*S, er = Math.max(1.6, 0.15*S), my = cy + 0.26*S;
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = Math.max(1.1, 0.08*S); c.strokeStyle = INK; c.fillStyle = INK;
  const lx = look ? look.x*er*0.45 : 0, ly = look ? look.y*er*0.45 : 0;
  // cheeks
  c.fillStyle = `rgba(255,100,120,${0.32*(A.blushK||1)})`;
  for (const s of [-1,1]){ c.beginPath(); c.ellipse(cx+s*0.64*S, cy+0.12*S, 0.16*S, 0.09*S, 0,0,TAU); c.fill(); }
  c.fillStyle = INK;
  const openEye = (x, k=1, sparkle) => {
    const rr = er*k;
    c.fillStyle = INK; c.beginPath(); c.ellipse(x+lx, ey+ly, rr*0.86, rr*1.06, 0,0,TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x+lx-rr*0.3, ey+ly-rr*0.4, rr*0.36,0,TAU); c.fill();
    if (sparkle){ c.beginPath(); c.arc(x+lx+rr*0.32, ey+ly+rr*0.38, rr*0.17,0,TAU); c.fill(); }
    c.fillStyle = INK;
  };
  const closedEye = (x) => { c.beginPath(); c.arc(x, ey-er*0.45, er*0.95, 0.15*Math.PI, 0.85*Math.PI); c.stroke(); };
  const happyEye = (x) => { c.beginPath(); c.arc(x, ey+er*0.55, er*0.95, 1.15*Math.PI, 1.85*Math.PI); c.stroke(); };
  const squeezeEye = (x, s) => { const k = er*0.9; c.beginPath(); c.moveTo(x-s*k, ey-k*0.85); c.lineTo(x+s*k*0.6, ey); c.lineTo(x-s*k, ey+k*0.85); c.stroke(); };
  const mouthOpen = (w, h) => {
    c.beginPath(); c.moveTo(cx-w, my-h*0.25); c.quadraticCurveTo(cx, my+h*1.5, cx+w, my-h*0.25); c.closePath();
    c.fillStyle = '#7a2a1a'; c.fill();
    c.save(); c.clip(); c.fillStyle = '#ff8080'; c.beginPath(); c.ellipse(cx, my+h*0.9, w*0.6, h*0.5, 0,0,TAU); c.fill(); c.restore();
    c.fillStyle = INK;
  };
  const mouthO = (k=1) => { c.beginPath(); c.ellipse(cx, my+0.03*S, 0.08*S*k, 0.1*S*k, 0,0,TAU); c.fillStyle = '#7a2a1a'; c.fill(); c.fillStyle = INK; };
  const wavy = () => { c.beginPath(); for (let i=0;i<=4;i++){ const x = cx - 0.16*S + i*0.08*S, y = my + (i%2 ? -0.035*S : 0.035*S); i ? c.lineTo(x,y) : c.moveTo(x,y); } c.stroke(); };
  const mouthIdle = () => {
    switch (A.mouth){
      case 'grin': mouthOpen(0.2*S, 0.13*S); break;
      case 'open': mouthOpen(0.17*S, 0.18*S); break;
      case 'o': mouthO(); break;
      case 'flat': c.beginPath(); c.moveTo(cx-0.12*S, my+0.03*S); c.quadraticCurveTo(cx, my-0.03*S, cx+0.12*S, my+0.03*S); c.stroke(); break;
      case 'smug': c.beginPath(); c.moveTo(cx-0.16*S, my-0.01*S); c.quadraticCurveTo(cx+0.02*S, my+0.13*S, cx+0.2*S, my-0.07*S); c.stroke(); break;
      default: c.beginPath(); c.arc(cx, my-0.12*S, 0.17*S, 0.18*Math.PI, 0.82*Math.PI); c.stroke();
    }
  };
  switch (ex){
    case 'happy':
      for (const s of [-1,1]) happyEye(cx+s*dx);
      mouthOpen(0.2*S, 0.15*S); break;
    case 'excited':
      for (const s of [-1,1]) openEye(cx+s*dx, 1.25, true);
      mouthOpen(0.15*S, 0.14*S); break;
    case 'ouch':
      squeezeEye(cx-dx, 1); squeezeEye(cx+dx, -1);
      mouthO(1.2); break;
    case 'worried':
      for (const s of [-1,1]){
        openEye(cx+s*dx, 0.8);
        c.beginPath(); c.moveTo(cx+s*dx - s*er*0.9, ey - er*1.45); c.lineTo(cx+s*dx + s*er*0.7, ey - er*1.85); c.stroke();
      }
      wavy();
      c.fillStyle = '#5ab4e6'; const sx = cx + 0.7*S, sy = ey - 0.2*S + ((nowT/700)%1)*0.12*S;
      c.beginPath(); c.moveTo(sx, sy - 0.16*S); c.quadraticCurveTo(sx + 0.1*S, sy, sx, sy + 0.06*S); c.quadraticCurveTo(sx - 0.1*S, sy, sx, sy - 0.16*S); c.fill();
      c.fillStyle = INK; break;
    case 'blink':
      for (const s of [-1,1]) closedEye(cx+s*dx);
      mouthIdle(); break;
    default:
      if (A.eyes === 'relaxed') for (const s of [-1,1]) closedEye(cx+s*dx);
      else for (const s of [-1,1]) openEye(cx+s*dx);
      if (A.mouth === 'flat') for (const s of [-1,1]){ c.beginPath(); c.moveTo(cx+s*dx + s*er*0.9, ey - er*1.55); c.lineTo(cx+s*dx - s*er*0.7, ey - er*1.2); c.stroke(); }
      mouthIdle();
  }
}

function drawItem(lv, x, y, ang, sc=1, alpha=1, o={}){
  const A = ART[lv], r = ITEMS[lv].r*sc, ow = lwOf(r), c = ctx;
  c.save(); c.globalAlpha = alpha; c.translate(x,y);
  if (o.sq){ c.rotate(o.sqA); c.scale(1 - o.sq, 1 + o.sq*0.7); c.rotate(-o.sqA); }
  c.save(); c.rotate(ang);
  if (A.back){ c.save(); A.back(r, ow); c.restore(); }
  c.save(); A.body(r, ow); c.restore();
  let lk = o.look;
  if (lk && ang){ const cs = Math.cos(-ang), sn = Math.sin(-ang); lk = {x:lk.x*cs - lk.y*sn, y:lk.x*sn + lk.y*cs}; }
  face(r, A, o.ex || 'idle', lk);
  c.restore();
  // upright light: soft shade bottom-right, gloss top-left, outline
  c.save(); clipDisc(r);
  c.beginPath(); c.arc(0,0,r+2,0,TAU); c.moveTo(-r*0.16 + r*1.04, -r*0.2); c.arc(-r*0.16,-r*0.2,r*1.04,0,TAU);
  c.fillStyle = 'rgba(60,30,10,.16)'; c.fill('evenodd');
  c.fillStyle = 'rgba(255,255,255,.5)';
  c.beginPath(); c.ellipse(-r*0.42,-r*0.5,r*0.24,r*0.11,-0.65,0,TAU); c.fill();
  c.beginPath(); c.arc(-r*0.16,-r*0.7,r*0.05,0,TAU); c.fill();
  c.restore();
  c.beginPath(); c.arc(0,0,r - ow*0.3,0,TAU); c.lineWidth = ow; c.strokeStyle = A.line; c.stroke();
  if (A.up){ c.save(); A.up(r, ow); c.restore(); }
  c.restore();
}

// portraits for the HUD, the collection trail and the discovery card
const portraits = [], silhouettes = [];
function makeArt(lv, sil){
  const S = 112, pc = document.createElement('canvas'); pc.width = pc.height = S;
  const g = pc.getContext('2d');
  const prev = ctx; ctx = g;
  try { drawItem(lv, S/2, S/2 + 6, 0, 33/ITEMS[lv].r, 1, {ex:'idle'}); } finally { ctx = prev; }
  if (sil){ g.globalCompositeOperation = 'source-in'; g.fillStyle = '#8fa3ad'; g.fillRect(0,0,S,S); }
  return pc.toDataURL();
}
function portrait(lv){ return portraits[lv] || (portraits[lv] = makeArt(lv, false)); }
function silhouette(lv){ return silhouettes[lv] || (silhouettes[lv] = makeArt(lv, true)); }

// ---------- per-body mood ----------
function exprFor(b, t){
  if (state === 'over') return 'ouch';
  if (clock - b.hitT < 420) return 'ouch';
  if (b.pop != null && clock - b.pop < 700) return 'happy';
  if (dangerT > 0 && b.position.y - b.circleRadius < DANGER + 70) return 'worried';
  if (b.twin) return 'excited';
  if ((t + b.seed) % 4200 < 140) return 'blink';
  return 'idle';
}

let lastDrawT = 0;
function draw(t){
  nowT = t;
  const dts = Math.min(0.05, (t - lastDrawT)/1000); lastDrawT = t;
  const k = scale*dpr;
  ctx.setTransform(k,0,0,k,0,0);
  if (shakeAmt){ ctx.translate((Math.random()-0.5)*shakeAmt, (Math.random()-0.5)*shakeAmt); }
  ctx.drawImage(bg, -10, -10, W+20, H+20);

  drawSun(t);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (const c of clouds){
    c.x += c.v * 16; if (c.x - 70*c.s > W) c.x = -70*c.s;
    const s2 = c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18*s2, 0, TAU); ctx.arc(c.x+20*s2, c.y-8*s2, 22*s2, 0, TAU);
    ctx.arc(c.x+44*s2, c.y, 17*s2, 0, TAU); ctx.rect(c.x, c.y, 44*s2, 17*s2);
    ctx.fill();
  }

  // danger line
  const warn = dangerT > 0;
  const pulse = warn ? 0.5 + 0.5*Math.sin(t/90) : 0;
  ctx.save();
  ctx.setLineDash([8,8]); ctx.lineWidth = 2;
  ctx.strokeStyle = warn ? `rgba(255,90,90,${0.5+pulse*0.5})` : 'rgba(31,58,74,.28)';
  ctx.beginPath(); ctx.moveTo(0,DANGER); ctx.lineTo(W,DANGER); ctx.stroke();
  ctx.restore();

  // held item + guide
  if (state === 'play' && !hammerMode){
    const it = ITEMS[cur];
    const x = Math.max(it.r+1, Math.min(W-it.r-1, aimX));
    aimX = x;
    const ready = clock >= cooldownUntil;
    ctx.save(); ctx.setLineDash([3,9]); ctx.lineWidth = 2;
    ctx.strokeStyle = ready ? 'rgba(31,58,74,.35)' : 'rgba(31,58,74,.12)';
    ctx.beginPath(); ctx.moveTo(x, DROP_Y+it.r); ctx.lineTo(x, H); ctx.stroke(); ctx.restore();
    if (ready){
      const ap = (clock - aimPop)/260;
      const sc = ap < 1 ? 0.6 + 0.4*Math.sin(ap*Math.PI/2) + Math.sin(ap*Math.PI)*0.15 : 1;
      drawItem(cur, x, DROP_Y, Math.sin(t*0.004)*0.08, sc, 1, {ex: ap < 1 ? 'happy' : 'idle', look:{x:0, y:1}});
    }
  }

  // bodies: twins look at each other, others watch the held item
  const list = items();
  for (const b of list) b.twin = null;
  for (let i=0;i<list.length;i++) for (let j=i+1;j<list.length;j++){
    const a = list[i], b = list[j];
    if (a.lvl !== b.lvl) continue;
    const ddx = b.position.x - a.position.x, ddy = b.position.y - a.position.y, d = Math.hypot(ddx, ddy) || 1;
    if (d < ITEMS[a.lvl].r*2.9 + 14){ a.twin = {x:ddx/d, y:ddy/d}; b.twin = {x:-ddx/d, y:-ddy/d}; }
  }
  for (const b of list){
    b.sqv += (-260*b.sq - 14*b.sqv)*dts; b.sq += b.sqv*dts;
    if (Math.abs(b.sq) < 0.002 && Math.abs(b.sqv) < 0.01){ b.sq = 0; b.sqv = 0; }
    let sc = 1;
    if (b.pop != null){ const a = (clock - b.pop)/220; sc = a >= 1 ? 1 : 0.55 + 0.45*Math.sin(a*Math.PI/2) + Math.sin(a*Math.PI)*0.16; }
    let look = b.twin;
    if (!look){ const vx = aimX - b.position.x, vy = DROP_Y - b.position.y, d = Math.hypot(vx,vy) || 1; look = {x:vx/d*0.7, y:vy/d*0.7}; }
    drawItem(b.lvl, b.position.x, b.position.y, b.angle, sc, 1, {ex:exprFor(b, t), look, sq:b.sq, sqA:b.sqA});
    if (hammerMode){
      ctx.save(); ctx.setLineDash([6,5]); ctx.lineDashOffset = -t*0.03; ctx.lineWidth = 2.5;
      ctx.strokeStyle = `rgba(255,90,60,${0.55 + 0.35*Math.sin(t*0.01)})`;
      ctx.beginPath(); ctx.arc(b.position.x, b.position.y, ITEMS[b.lvl].r + 4, 0, TAU); ctx.stroke(); ctx.restore();
    }
  }

  // merge ghosts slide into the new item; smashed items flatten
  for (const g of ghosts){
    const p = 1 - g.life, e = p*p*(3-2*p);
    const x = g.sx + (g.tx - g.sx)*e, y = g.sy + (g.ty - g.sy)*e;
    if (g.flat) drawItem(g.lv, x, y, g.ang, 1, Math.max(0, g.life), {ex:'ouch', sq:Math.min(0.75, p*1.2), sqA:Math.PI/2});
    else drawItem(g.lv, x, y, g.ang, 1 - p*0.35, Math.max(0, g.life), {ex:'happy'});
  }

  // shockwave rings
  for (const rg of rings){
    const p = 1 - rg.life, rr = rg.r0 + (rg.r1 - rg.r0)*(1 - Math.pow(1-p, 3));
    ctx.save(); ctx.globalAlpha = rg.life;
    if (p < 0.25){ ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(rg.x, rg.y, rr*0.9, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = rg.color; ctx.lineWidth = 2 + 7*rg.life;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rr, 0, TAU); ctx.stroke(); ctx.restore();
  }

  // particles
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color;
    if (p.star){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); const s = p.size*1.4;
      ctx.beginPath(); for (let i=0;i<10;i++){ const rr = i%2 ? s*0.42 : s, a = i*Math.PI/5; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); ctx.restore();
    } else { ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(p.grow ? 1 : p.life)+0.5,0,TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  // hammer swing
  for (const h of hammerFx){
    const p = 1 - h.life, sw = Math.min(1, p/0.35), e = 1 - Math.pow(1-sw, 3);
    const L = Math.max(46, h.r*1.5);
    ctx.save(); ctx.globalAlpha = Math.min(1, h.life*2.5);
    ctx.translate(h.x + L*0.85, h.y + L*0.05); ctx.rotate(-1.25 + e*1.35);
    ctx.fillStyle = '#b07a44'; ctx.strokeStyle = '#4a2e14'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(-L, -5, L, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8e9ca3'; ctx.strokeStyle = '#2d3b44';
    ctx.beginPath(); ctx.rect(-L-14, -20, 28, 40); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-L-10, -16, 6, 32);
    ctx.restore();
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const tx of texts){
    ctx.globalAlpha = Math.min(1, tx.life*1.6);
    ctx.font = `${tx.small?18:26}px Jua, "Apple SD Gothic Neo", sans-serif`;
    ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = '#5c3a1f';
    ctx.strokeText(tx.t, tx.x, tx.y);
    ctx.fillStyle = '#fff3b0';
    ctx.fillText(tx.t, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(t){
  const dt = Math.min(50, t - last); last = t;
  if (state === 'play'){
    if (hitStop > 0){ hitStop -= dt; acc = 0; }
    else {
      acc += dt;
      while (acc >= STEP){
        Engine.update(engine, STEP);
        clock += STEP;
        processMerges();
        acc -= STEP;
      }
    }
    checkDanger(dt);
  }
  if (shownScore !== score){
    shownScore = score - shownScore > 1 ? shownScore + Math.ceil((score - shownScore)*0.18) : score;
    $('score').textContent = shownScore;
  }
  updateFx(dt);
  draw(t);
  requestAnimationFrame(frame);
}

// ---------- boot ----------
$('best').textContent = best;
buildChain(); renderChain(); renderNext(); renderTools();
[0,2,4,7,10].forEach((lv,i) => {
  const im = new Image(); im.src = portrait(lv); im.alt = ''; im.width = im.height = 44 + i*4;
  im.style.animationDelay = (i*0.14) + 's';
  $('parade').appendChild(im);
});
requestAnimationFrame(frame);
})();
</script>
</body>
